name: Security

# Known-vulnerability audits of every dependency tree.
# Manual only: GitHub Actions minutes are limited, so nothing runs on push, pull request or a
# timer. Run the same checks locally with tools/check.ps1; start this from the Actions tab
# (Run workflow) when a hosted run is wanted.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: desktop

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm audit --prod --audit-level high
        working-directory: harness

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.txt
        working-directory: engine
      - run: uvx pip-audit --strict -r requirements.txt
        working-directory: engine
