name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine (Python)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Headless design on the Gent fixture
        run: >
          uv run openftth-engine design
          --area ../fixtures/gent/area.geojson
          --osm ../fixtures/gent/gent.osm
          --rulebook ../rulebooks/belgium.yaml
          --out ../runs/ci
      - uses: actions/upload-artifact@v4
        with:
          name: gent-design-${{ matrix.os }}
          path: runs/ci
          if-no-files-found: error

  # Phase 1 adds: harness (pnpm test) and desktop (cargo test/clippy) jobs.
