name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine (Python)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Headless design on the Gent fixture
        run: >
          uv run openftth-engine design
          --area ../fixtures/gent/area.geojson
          --osm ../fixtures/gent/gent.osm
          --rulebook ../rulebooks/belgium.yaml
          --out ../runs/ci
      - uses: actions/upload-artifact@v4
        with:
          name: gent-design-${{ matrix.os }}
          path: runs/ci
          if-no-files-found: error

  harness:
    name: Harness (Node)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke:packaged

  # Phase 1 adds a desktop (cargo test/clippy) job once the Rust workspace exists.
