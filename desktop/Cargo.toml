[workspace]
resolver = "2"
members = ["crates/openftth-core", "crates/openftth-client", "crates/openftth-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = ""

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
ureq = { version = "3", features = ["json"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.37"
egui_extras = "0.37"
rfd = "0.17"
rand = "0.10"

# Debug builds must still draw a few thousand map elements per frame: optimise the
# dependencies (egui, epaint, wgpu) fully and our own crates lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
