format: openftth.import
version: 1
name: amsterdam-jordaan-register
description: amsterdam-jordaan from its official address register, streets and buildings from OSM
bindings:
- {path: amsterdam-jordaan.geojson, role: area}
- path: raw/amsterdam-jordaan-addresses.geojson
  role: addresses
  columns: {id: id, units: units, street: street, housenumber: housenumber, postcode: postcode, building_id: building_id}
- {path: raw/amsterdam-jordaan.osm, role: osm}
