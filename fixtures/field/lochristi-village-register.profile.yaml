format: openftth.import
version: 1
name: lochristi-village-register
description: lochristi-village from its official address register, streets and buildings from OSM
bindings:
- {path: lochristi-village.geojson, role: area}
- path: raw/lochristi-village-addresses.geojson
  role: addresses
  columns: {id: id, units: units, street: street, housenumber: housenumber, postcode: postcode}
- {path: raw/lochristi-village.osm, role: osm}
